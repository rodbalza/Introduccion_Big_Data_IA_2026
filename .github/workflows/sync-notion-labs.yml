name: Sync Notion - Laboratorios

on:
  workflow_dispatch:
    inputs:
      publicar:
        description: "Publicar laboratorios (desmarcado = previsualizacion)"
        type: boolean
        default: false
        required: true
      regenerar_todo:
        description: "Forzar regeneracion completa aunque no haya cambios"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: notion-sync-public
  cancel-in-progress: false

jobs:
  laboratorios:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: python -m pip install "requests>=2.32,<3"

      - name: Consultar Laboratorios de Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_LABS_ID: ${{ vars.NOTION_LABS_ID }}
          NOTION_CLASES_ID: ${{ vars.NOTION_CLASES_ID }}
          PUBLICAR: ${{ inputs.publicar }}
          REGENERAR_TODO: ${{ inputs.regenerar_todo }}
        run: |
          if [ "$PUBLICAR" = "true" ]; then
            python sync/export_labs.py --publish $([ "$REGENERAR_TODO" = "true" ] && echo --force)
          else
            python sync/export_labs.py $([ "$REGENERAR_TODO" = "true" ] && echo --force)
          fi

      - name: Publicar cambios
        if: ${{ inputs.publicar }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- laboratorios/ .notion-labs-state.json
          if git diff --cached --quiet; then
            echo "No hay cambios que publicar."
            exit 0
          fi
          git commit -m "Sync Notion: laboratorios"
          git push
