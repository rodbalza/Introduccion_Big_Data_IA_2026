name: Publicar presentaciones en GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "clases/**"
      - ".github/workflows/publicar-presentaciones.yml"
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Sync Notion - Todo"
      - "Sync Notion - Clases"
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-presentaciones
  cancel-in-progress: false

jobs:
  desplegar:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obtener archivos
        uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Preparar contenido publicado
        shell: bash
        run: |
          mkdir -p _site
          touch _site/.nojekyll
          cp -R clases _site/clases
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="es">
          <head><meta charset="utf-8"><title>Presentaciones del curso</title></head>
          <body>
            <h1>Presentaciones del curso Introducción al Big Data e IA</h1>
            <p>Accede a las presentaciones desde el <a href="https://github.com/rodbalza/Introduccion_Big_Data_IA_2026/tree/main/clases">índice de clases</a>.</p>
          </body>
          </html>
          HTML

      - name: Subir artefacto a Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar Pages
        id: deployment
        uses: actions/deploy-pages@v4
